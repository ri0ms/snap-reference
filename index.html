<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reference — 스냅사진 레퍼런스 보드</title>
<meta name="description" content="스냅사진 레퍼런스를 6개 컨셉으로 나눠 모으는 보드.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128247;</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Parisienne&display=swap">
<style>
:root{
  --paper:#F2F2F0;
  --surface:#FFFFFF;
  --ph:#E6E6E3;
  --ink:#111111;
  --ink60:#6B6B68;
  --ink35:#A5A5A0;
  --line:#DCDCD8;
  --live:#2563EB;
  --live-soft:#DCE8FF;
  /* 강조색 — 제목과 "누를 수 있는 것"에만. 배경·카드 같은 넓은 면에는 쓰지 않습니다 */
  --accent:#0D7370;
  --gx:26px;
  --font:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --display:"DM Serif Display","Playfair Display",Georgia,serif;
  --script:"Parisienne","Snell Roundhand","Apple Chancery",cursive;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- header ---------- */
#hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--paper);
  height:56px;display:flex;align-items:center;gap:16px;
  padding-inline:var(--gx);
}
#hdr .brand{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.02em;flex:none}
#hdr nav{
  flex:1;display:flex;gap:30px;justify-content:center;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
#hdr nav::-webkit-scrollbar{display:none}
#hdr nav button{
  font-family:var(--script);font-size:20px;font-weight:400;letter-spacing:.01em;
  line-height:1.25;color:var(--ink60);white-space:nowrap;
  /* 2px 로 고정 — 선택 시 굵기가 바뀌면 글자가 1px 밀립니다 */
  padding-bottom:6px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:5px;
}
#hdr nav button:hover{color:var(--accent)}
#hdr nav button.cur{color:var(--accent);border-bottom-color:var(--accent)}
#hdr .who{
  flex:none;font-size:11.5px;color:var(--ink60);letter-spacing:.04em;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
#hdr .who .peer{display:flex;align-items:center;gap:5px}
@media (max-width:767px){#hdr .who{display:none}}
.dot{width:4px;height:4px;border-radius:50%;background:var(--live);flex:none;display:inline-block}

/* ---------- home ---------- */
.wrap{padding-inline:var(--gx);max-width:1600px;margin:0 auto}
.hero{text-align:center;padding-block:76px 26px}
.hero h1{
  margin:0;font-family:var(--display);color:var(--accent);
  font-size:clamp(34px,9vw,122px);font-weight:400;
  letter-spacing:.006em;word-spacing:-.01em;line-height:.98;white-space:nowrap;
  font-feature-settings:"kern" 1;
}
.hero .meta{margin:12px 0 0;font-size:11.5px;letter-spacing:.10em;color:var(--ink60)}
.hero .warn{
  margin:14px 0 0;font-size:11px;letter-spacing:.02em;color:var(--ink35);
}

.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding-bottom:26px}
.cat{display:flex;flex-direction:column;text-align:left;width:100%}
.cat .thumb{
  aspect-ratio:3/4;background:var(--ph);position:relative;overflow:hidden;
  display:grid;place-items:center;
}
.cat .thumb img{width:100%;height:100%;object-fit:cover;transition:filter .16s}
.cat:hover .thumb img{filter:brightness(.96)}
.cat .lb .n{transition:color .16s}
.cat:hover .lb .n{color:var(--accent)}
.cat .thumb .none{font-size:11px;color:var(--ink35);letter-spacing:.04em}
.cat .lb{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.cat .lb .n{font-family:var(--script);font-size:22px;font-weight:400;letter-spacing:.01em;line-height:1.25}
.cat .lb .c{font-size:11.5px;font-weight:500;color:var(--ink60);font-variant-numeric:tabular-nums}

.slider{display:none;justify-content:center;padding-bottom:30px}
.slider .trk{width:200px;height:1px;background:var(--line);position:relative}
.slider .hd{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid var(--ink);transform:translateX(-50%)}

/* ---------- category view ---------- */
.ctitle{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-block:30px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.ctitle .l{display:flex;align-items:baseline;gap:9px}
.ctitle h2{margin:0;font-family:var(--display);font-size:34px;font-weight:400;letter-spacing:.012em}
.ctitle .c{font-size:11.5px;color:var(--ink60);font-variant-numeric:tabular-nums}
.ctitle .r{display:flex;gap:12px;align-items:center}
.ctitle .r #btn-upload{font-size:13px;margin-right:4px}
.ctitle .r #btn-upload:hover{text-decoration:underline;text-underline-offset:3px}

/* 흰색 라운드 버튼 */
.pill{
  background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 16px;
  font-size:13px;line-height:1.5;white-space:nowrap;
  box-shadow:0 1px 2px rgba(17,17,17,.05), 0 2px 10px rgba(17,17,17,.05);
  transition:box-shadow .16s, background .16s, color .16s;
}
.pill:hover{box-shadow:0 2px 4px rgba(17,17,17,.09), 0 4px 14px rgba(17,17,17,.08)}
.pill:active{box-shadow:0 1px 2px rgba(17,17,17,.06)}
.pill.on{background:var(--ink);color:var(--paper)}
.pill.quiet{color:var(--ink35)}

.chips{display:flex;gap:20px;align-items:center;padding-block:12px 22px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  font-size:13px;color:var(--ink60);white-space:nowrap;
  /* 위 3px = 아래 2px + 밑줄 1px — 알약 버튼과 글자 높이를 맞추기 위한 대칭 여백 */
  padding:3px 0 2px;border-bottom:1px solid transparent;
}
.chips button:hover{color:var(--ink)}
.chips button.cur{color:var(--ink);border-bottom-color:var(--ink)}
/* .chips button 의 padding-bottom 이 .pill 을 덮어써 글자가 위로 치우치던 것 복구 */
.chips button.pill{padding:6px 16px;border-bottom:0}
.chips button.add{color:var(--ink);margin-left:4px}
.chips input{
  border:0;border-bottom:1px solid var(--ink);background:none;
  font-size:13px;width:110px;padding:0 0 2px;outline:none;
}
.chips .err{font-size:11px;color:var(--ink60);align-self:center}

#grid{padding-bottom:80px}
.row{display:flex;gap:18px;margin-bottom:18px}
.tile{position:relative;background:var(--ph);overflow:hidden;flex:none}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease-out,filter .16s}
.tile img.on{opacity:1}
.tile:hover img{filter:brightness(.96)}
.tile.live{outline:1px solid var(--live);outline-offset:-1px}
.tile .cap{
  position:absolute;left:0;right:0;bottom:0;padding:7px 9px;
  font-size:11px;color:#fff;letter-spacing:.02em;
  background:rgba(17,17,17,.42);opacity:0;transition:opacity .16s;
  pointer-events:none;
}
.tile:hover .cap{opacity:1}
.tile .pick{
  position:absolute;top:8px;left:8px;width:16px;height:16px;
  border:1px solid rgba(255,255,255,.9);background:rgba(17,17,17,.25);
  display:grid;place-content:center;opacity:0;transition:opacity .16s;
}
.tile:hover .pick,.tile.sel .pick,body.picking .tile .pick{opacity:1}
.tile.sel .pick{background:var(--ink);border-color:var(--ink)}
.tile.sel .pick::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tile .bar{position:absolute;left:0;bottom:0;height:1px;background:var(--live);width:0;transition:width .2s}

.empty{
  border:1px dashed var(--line);height:260px;display:grid;place-content:center;
  text-align:center;color:var(--ink60);font-size:13px;line-height:2;
}

/* ---------- selection bar ---------- */
#selbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--line);
  min-height:52px;display:flex;align-items:center;gap:20px;
  padding:10px var(--gx);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  flex-wrap:wrap;
}
#selbar .n{font-size:13px;font-weight:500;flex:none}
#selbar button{font-size:13px;color:var(--ink60)}
#selbar button:hover{color:var(--ink)}
#selbar .sp{flex:1}
#selbar .warn{font-size:11px;color:var(--ink35);width:100%}
.menu{
  position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);
  min-width:150px;padding:6px 0;
}
.menu button{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px}
.menu button:hover{background:var(--paper)}

/* ---------- drop overlay ---------- */
#drop{
  position:fixed;inset:0;z-index:60;display:grid;place-content:center;text-align:center;
  background:rgba(242,242,240,.93);
}
#drop .in{border:1px dashed var(--ink);padding:56px 64px;font-size:18px;font-weight:300;line-height:1.8}
#drop b{font-weight:500}

/* ---------- lightbox ---------- */
#lb{
  position:fixed;inset:0;z-index:70;background:rgba(242,242,240,.96);
  display:grid;grid-template-rows:1fr;overflow:auto;
}
#lb .inner{
  display:grid;grid-template-columns:1fr 320px;gap:32px;
  padding:56px var(--gx) 32px;align-items:start;min-height:100%;
}
#lb .stage{display:grid;place-items:center;position:relative;min-height:50vh}
#lb .stage img{max-width:100%;max-height:82vh;width:auto;height:auto;object-fit:contain}
#lb .nav{position:absolute;inset:auto 0 -34px 0;display:flex;gap:22px;justify-content:center;font-size:18px;color:var(--ink60)}
#lb .nav button:hover{color:var(--ink)}
#lb .side{display:flex;flex-direction:column;gap:14px;padding-top:4px}
#lb .side .where{font-size:13px}
#lb .side .meta{font-size:11.5px;color:var(--ink60);letter-spacing:.04em}
#lb .side hr{border:0;border-top:1px solid var(--line);margin:2px 0}
#lb .side h3{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.10em;color:var(--ink60)}
#lb .cmts{display:flex;flex-direction:column;gap:9px;max-height:38vh;overflow-y:auto}
#lb .cmt{font-size:13px;line-height:1.6}
#lb .cmt b{font-weight:500;margin-right:7px}
#lb .cmt span{color:var(--ink60)}
#lb .cmt .t{font-size:10.5px;color:var(--ink35);margin-left:6px}
#lb .box{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
#lb .box input{flex:1;border:0;background:none;outline:none;font-size:13px}
#lb .box button{font-size:12px;color:var(--ink60);flex:none}
#lb .acts{display:flex;gap:18px;font-size:13px;color:var(--ink60);padding-top:4px}
#lb .acts button:hover{color:var(--ink)}
#lb .close{position:fixed;top:16px;right:20px;font-size:22px;line-height:1;color:var(--ink60);z-index:2}
#lb .close:hover{color:var(--ink)}

/* ---------- name gate ---------- */
#gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:grid;place-content:center;text-align:center;padding:20px}
#gate .t{font-family:var(--display);color:var(--accent);font-size:clamp(32px,7.4vw,60px);font-weight:400;letter-spacing:.006em;line-height:.98;margin:0 0 14px}
#gate p{margin:0 0 30px;font-size:13px;color:var(--ink60)}
#gate .f{display:flex;gap:12px;justify-content:center;align-items:baseline}
#gate input{border:0;border-bottom:1px solid var(--ink);background:none;outline:none;font-size:16px;width:170px;text-align:center;padding-bottom:6px}
#gate button{font-size:13px;border-bottom:1px solid var(--ink);padding-bottom:2px}

/* ---------- responsive ---------- */
@media (max-width:1279px){
  .strip{
    grid-template-columns:repeat(6,minmax(170px,1fr));
    overflow-x:auto;scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .slider{display:flex}
}
@media (max-width:1023px){
  .strip{grid-template-columns:repeat(3,1fr);overflow:visible;row-gap:26px}
  .slider{display:none}
  #lb .inner{grid-template-columns:1fr;gap:22px}
  #lb .stage img{max-height:62vh}
  #lb .cmts{max-height:none}
}
@media (max-width:767px){
  :root{--gx:16px}
  #hdr{gap:10px}
  #hdr nav{justify-content:flex-start}
  .hero{padding-block:44px 20px}
  .hero h1{white-space:normal}
  .strip{grid-template-columns:repeat(2,1fr);gap:8px;row-gap:22px}
  .ctitle h2{font-size:22px}
  #lb .inner{padding-top:48px}
  #lb .stage img{max-height:56vh}
}
/* ---------- 알림 ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;
  background:var(--ink);color:var(--paper);
  font-size:13px;line-height:1.5;padding:10px 18px;border-radius:999px;
  max-width:calc(100vw - 32px);text-align:center;
  box-shadow:0 2px 14px rgba(17,17,17,.18);
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header id="hdr">
  <button class="brand" id="home-link">Reference</button>
  <nav id="nav"></nav>
  <span class="who" id="who"></span>
</header>

<main>
  <section id="view-home" class="wrap">
    <div class="hero">
      <h1>SNAP REFERENCE</h1>
      <p class="meta" id="home-meta">[ ALL · 0 PHOTOS ]</p>
    </div>
    <div class="strip" id="strip"></div>
    <div class="slider"><div class="trk"><div class="hd" id="sl-hd" style="left:12%"></div></div></div>
  </section>

  <section id="view-cat" class="wrap" hidden>
    <div class="ctitle">
      <span class="l"><h2 id="cat-name">PERSONAL</h2><span class="c" id="cat-count">[0]</span></span>
      <span class="r">
        <button id="btn-upload">↑ 사진 올리기</button>
        <button id="btn-pick" class="pill">전체</button>
        <button id="btn-del" class="pill quiet">삭제</button>
      </span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="grid"></div>
  </section>
</main>

<div id="selbar" hidden>
  <span class="n" id="sel-n">0장 선택</span>
  <button id="sel-move">폴더로 이동</button>
  <button id="sel-dl">다운로드</button>
  <button id="sel-del">삭제</button>
  <span class="sp"></span>
  <button id="sel-off">선택 해제</button>
  <span class="warn" id="sel-warn" hidden></span>
</div>

<div id="drop" hidden><div class="in">여기에 놓으면<br><b id="drop-where">[개인]</b>에 올라갑니다</div></div>

<div id="lb" hidden>
  <button class="close" id="lb-close" aria-label="닫기">×</button>
  <div class="inner">
    <div class="stage">
      <img id="lb-img" alt="">
      <div class="nav"><button id="lb-prev" aria-label="이전">‹</button><button id="lb-next" aria-label="다음">›</button></div>
    </div>
    <div class="side">
      <span class="where" id="lb-where"></span>
      <span class="meta" id="lb-meta"></span>
      <hr>
      <h3>댓글</h3>
      <div class="cmts" id="lb-cmts"></div>
      <div class="box"><input id="lb-input" placeholder="댓글 쓰기…" maxlength="300"><button id="lb-send">보내기</button></div>
      <hr>
      <div class="acts"><button id="lb-dl">↓ 원본 다운로드</button><button id="lb-del">삭제</button></div>
    </div>
  </div>
</div>

<div id="gate">
  <p class="t">REFERENCE</p>
  <p>어떤 이름으로 올릴까요?</p>
  <div class="f">
    <input id="gate-in" placeholder="닉네임" maxlength="12" autocomplete="off">
    <button id="gate-go">시작</button>
  </div>
</div>

<div id="toast" hidden></div>

<input type="file" id="filein" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ================= 설정 =================
   아래 두 값은 브라우저에 공개되는 값입니다(공개용 키).
   sb_secret_ 로 시작하는 키는 절대 여기에 넣지 마세요. */
var SUPABASE_URL = "https://noqhumgrvthbyamszdzf.supabase.co";
var SUPABASE_KEY = "sb_publishable_SP4OHXoZYqkyhqvRHPHl0Q_BYeU0J3n";
var BUCKET       = "photos";

var MAX_EDGE = 2400;            /* 올릴 때 긴 변을 이 크기로 줄입니다 */
var JPEG_Q   = 0.88;
var MAX_FILE = 15 * 1024 * 1024;
var PER_BATCH = 10;

/* name = 대문자 (헤더 내비 · 상세 제목 · 안내 문구)
   label = 대소문자 혼용 (카드 라벨 — 필기체는 대문자만으로는 읽히지 않음) */
var CATS=[
  {slug:"personal",name:"PERSONAL",label:"Personal"},
  {slug:"couple",name:"COUPLE",label:"Couple"},
  {slug:"friends",name:"FRIENDS",label:"Friends"},
  {slug:"daily",name:"DAILY",label:"Daily"},
  {slug:"self-wedding",name:"SELF WEDDING",label:"Self Wedding"},
  {slug:"wedding-studio",name:"WEDDING STUDIO",label:"Wedding Studio"}
];

var sb=null, me="", view="home", cat=null, folder=null;
var photos=[], folders=[], picking=false, sel=[], lbIdx=-1, lbList=[];
var io=null, chan=null, warnedStorage=false;

/* ================= 유틸 ================= */
function $(id){return document.getElementById(id)}
function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e}
function catOf(slug){for(var i=0;i<CATS.length;i++)if(CATS[i].slug===slug)return CATS[i];return CATS[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function byId(id){for(var i=0;i<photos.length;i++)if(photos[i].id===id)return photos[i];return null}
function publicUrl(path){return SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+path}
function when(ts){
  var t=new Date(ts).getTime();
  var d=(Date.now()-t)/1000;
  if(d<60)return "방금";
  if(d<3600)return Math.floor(d/60)+"분 전";
  if(d<86400)return Math.floor(d/3600)+"시간 전";
  var x=new Date(t);
  return x.getFullYear()+"."+String(x.getMonth()+1).padStart(2,"0")+"."+String(x.getDate()).padStart(2,"0");
}
function toast(msg){
  var b=$("toast");
  b.textContent=msg;
  b.hidden=false;
  clearTimeout(b._t);
  b._t=setTimeout(function(){b.hidden=true},3600);
}

/* ================= 헤더 ================= */
function renderHeader(){
  var nav=$("nav");
  nav.innerHTML="";
  if(view==="cat"){
    CATS.forEach(function(c){
      var b=el("button");
      if(c.slug===cat)b.className="cur";
      b.appendChild(document.createTextNode(c.label));
      b.onclick=function(){goCat(c.slug)};
      nav.appendChild(b);
    });
  }
}
function renderPeers(){
  var box=$("who");
  box.innerHTML="";
  if(!chan)return;
  var st={};
  try{st=chan.presenceState()||{}}catch(e){return}
  var names=[];
  Object.keys(st).forEach(function(k){
    (st[k]||[]).forEach(function(m){
      if(m&&m.name&&names.indexOf(m.name)<0)names.push(m.name);
    });
  });

/* ================= 저스티파이드 그리드 ================= */
function layoutRows(items,cw,targetH,gap){
  var rows=[],row=[],sum=0;
  for(var i=0;i<items.length;i++){
    row.push(items[i]);sum+=(items[i].ratio||1);
    var h=(cw-gap*(row.length-1))/sum;
    if(h<=targetH){rows.push({items:row,height:h});row=[];sum=0}
  }
  if(row.length)rows.push({items:row,height:targetH,last:true});
  return rows;
}
function targetHeight(){
  var w=innerWidth;
  if(w>=1280)return 260;
  if(w>=1024)return 220;
  return 180;
}
function renderGrid(){
  var g=$("grid");
  g.innerHTML="";
  if(io){io.disconnect();io=null}
  var list=visible();
  lbList=list;

  if(!list.length){
    var e=el("div","empty");
    e.innerHTML=folder
      ? "이 폴더는 비어 있습니다.<br>사진을 선택해 옮겨보세요."
      : "아직 사진이 없습니다.<br>파일을 여기로 끌어다 놓으세요.";
    g.appendChild(e);
    return;
  }

  io=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var t=en.target;
      io.unobserve(t);
      var img=t.querySelector("img");
      if(img&&!img.src){
        img.src=t.dataset.url;
        img.onload=function(){img.classList.add("on")};
      }
    });
  },{rootMargin:"300px 0px"});

  var cw=g.clientWidth||(innerWidth-52);
  var gap=18,mobile=innerWidth<768;

  if(mobile){
    /* 2열 고정 그리드 — 좁은 폭에서는 저스티파이드가 널뜀 */
    var cols=[[],[]],hs=[0,0];
    list.forEach(function(p){
      var k=hs[0]<=hs[1]?0:1;
      cols[k].push(p);hs[k]+=1/(p.ratio||1);
    });
    var row=el("div","row");
    row.style.gap="8px";
    row.style.alignItems="flex-start";
    cols.forEach(function(col){
      var c=el("div");
      c.style.flex="1";c.style.display="flex";c.style.flexDirection="column";c.style.gap="8px";
      c.style.minWidth="0";
      col.forEach(function(p){
        var t=tile(p);
        t.style.width="100%";
        t.style.aspectRatio=(p.ratio||1);
        t.style.height="auto";
        c.appendChild(t);
      });
      row.appendChild(c);
    });
    g.appendChild(row);
    return;
  }

  layoutRows(list,cw,targetHeight(),gap).forEach(function(r){
    var row=el("div","row");
    r.items.forEach(function(p){
      var t=tile(p);
      t.style.height=r.height+"px";
      t.style.width=(r.height*(p.ratio||1))+"px";
      row.appendChild(t);
    });
    g.appendChild(row);
  });
}
function tile(p){
  var t=el("div","tile");
  t.dataset.id=p.id;
  t.dataset.url=publicUrl(p.path);
  if(sel.indexOf(p.id)>=0)t.classList.add("sel");
  if(p.fresh)t.classList.add("live");

  var img=el("img");
  img.alt=catOf(p.cat).name+" 카테고리 사진, "+p.uploader+" 업로드";
  t.appendChild(img);

  var cap=el("div","cap");
  cap.textContent="["+p.uploader+" · "+when(p.created_at)+"]";
  t.appendChild(cap);

  var pick=el("div","pick");
  pick.onclick=function(e){e.stopPropagation();toggleSel(p.id,t)};
  t.appendChild(pick);

  t.onclick=function(){
    if(picking||sel.length){toggleSel(p.id,t);return}
    openLb(lbList.indexOf(p));
  };
  if(io)io.observe(t);
  return t;
}

/* ================= 업로드 ================= */
function processImage(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file);
    var im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight;
      if(!w||!h){URL.revokeObjectURL(url);res(null);return}
      var ratio=w/h;
      var scale=Math.min(1,MAX_EDGE/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
      var c=document.createElement("canvas");
      c.width=cw;c.height=ch;
      c.getContext("2d").drawImage(im,0,0,cw,ch);
      c.toBlob(function(b){
        URL.revokeObjectURL(url);
        res(b?{blob:b,ratio:ratio}:null);
      },"image/jpeg",JPEG_Q);
    };
    im.onerror=function(){URL.revokeObjectURL(url);res(null)};
    im.src=url;
  });
}
function handleFiles(files){
  var arr=Array.prototype.slice.call(files);
  var tooBig=false,notImage=false;
  var good=arr.filter(function(f){
    if(!/^image\//.test(f.type)){notImage=true;return false}
    if(f.size>MAX_FILE){tooBig=true;return false}
    return true;
  });
  if(notImage)toast("이미지 파일만 올릴 수 있습니다 (JPG, PNG, WEBP)");
  else if(tooBig)toast("한 장에 15MB까지 올릴 수 있습니다");
  if(!good.length)return;

  var targetCat=cat,targetFolder=folder;
  var chain=Promise.resolve(),failed=0,undecodable=0;

  good.slice(0,PER_BATCH).forEach(function(f){
    chain=chain.then(function(){
      return processImage(f).then(function(d){
        if(!d){undecodable++;return}
        var id=uid(),path=id+".jpg";
        return sb.storage.from(BUCKET).upload(path,d.blob,{contentType:"image/jpeg"})
          .then(function(up){
            if(up.error)throw up.error;
            var rec={id:id,cat:targetCat,folder:targetFolder,name:f.name,ratio:d.ratio,path:path,uploader:me};
            return sb.from("photos").insert(rec).then(function(ins){
              if(ins.error)throw ins.error;
              if(view==="cat"&&cat===targetCat&&!byId(id)){
                photos.unshift(rec);
                renderCat();
              }
            });
          })
          .catch(function(){failed++});
      });
    });
  });

  chain.then(function(){
    if(undecodable)toast(undecodable+"장은 이 브라우저가 열 수 없는 형식입니다 (아이폰 HEIC 등)");
    else if(failed)toast(failed+"장을 올리지 못했습니다. 다시 시도해 주세요");
  });
}

function removePhotos(ids){
  var mine=ids.filter(function(id){var p=byId(id);return p&&p.uploader===me});
  if(!mine.length)return Promise.resolve();
  var paths=mine.map(function(id){var p=byId(id);return p?p.path:null}).filter(Boolean);
  return sb.storage.from(BUCKET).remove(paths).then(function(r){
    /* 삭제 정책이 없으면 error 없이 빈 배열이 옵니다 — 조용히 실패하므로 개수로 판단 */
    var removed=(r.data&&r.data.length)||0;
    if((r.error||removed<paths.length)&&!warnedStorage){
      warnedStorage=true;
      toast("목록에서는 지워졌지만 사진 파일이 서버에 남았습니다 — 삭제 정책을 추가해 주세요");
    }

  }).then(function(r){
    if(r.error){toast("지우지 못했습니다");return}
    photos=photos.filter(function(p){return mine.indexOf(p.id)<0});
  });
}

/* ================= 실시간 ================= */
function connect(){
  chan=sb.channel("board",{config:{presence:{key:uid()}}});
  chan.on("postgres_changes",{event:"INSERT",schema:"public",table:"photos"},function(p){onInsert(p.new)});
  chan.on("postgres_changes",{event:"DELETE",schema:"public",table:"photos"},function(p){onRemove(p.old)});
  chan.on("postgres_changes",{event:"*",schema:"public",table:"comments"},function(p){
    var row=p.new||p.old;
    if(lbIdx>=0&&row&&lbList[lbIdx]&&lbList[lbIdx].id===row.photo_id)loadComments(row.photo_id);
  });
  chan.on("presence",{event:"sync"},renderPeers);
  chan.subscribe(function(status){
    if(status==="SUBSCRIBED")chan.track({name:me});
  });
}
function onInsert(row){
  if(!row)return;
  if(view==="home"){loadHome();return}
  if(view!=="cat"||row.cat!==cat)return;
  if(byId(row.id))return;
  row.fresh=(row.uploader!==me);
  photos.unshift(row);
  renderCat();
  if(row.fresh){
    setTimeout(function(){
      row.fresh=false;
      var t=document.querySelector('.tile[data-id="'+row.id+'"]');
      if(t)t.classList.remove("live");
    },4000);
  }
}
function onRemove(row){
  if(!row||!row.id)return;
  if(view==="home"){loadHome();return}
  var before=photos.length;
  photos=photos.filter(function(p){return p.id!==row.id});
  if(photos.length!==before){
    if(lbIdx>=0&&lbList[lbIdx]&&lbList[lbIdx].id===row.id)closeLb();
    renderCat();
  }
}

      if(folders.some(function(f){return f.name===v})){toast("같은 이름의 폴더가 있습니다");return}
      var rec={id:uid(),cat:cat,name:v};
      sb.from("folders").insert(rec).then(function(r){
        if(r.error){toast("폴더를 만들지 못했습니다");return}
        folders.push(rec);renderChips();moveTo(rec.id);
      });
    };
    m.appendChild(nf);
    document.body.appendChild(m);
    var r=e.currentTarget.getBoundingClientRect();
    m.style.left=Math.min(r.left,innerWidth-170)+"px";
    m.style.top=Math.max(8,r.top-m.offsetHeight-8)+"px";
    setTimeout(function(){document.addEventListener("click",closeMenu,{once:true})},0);
  };

  $("lb-close").onclick=closeLb;
  $("lb-prev").onclick=function(){stepLb(-1)};
  $("lb-next").onclick=function(){stepLb(1)};
  $("lb-send").onclick=sendCmt;
  $("lb-input").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendCmt()}};
  $("lb-dl").onclick=function(){if(lbIdx>=0)download(lbList[lbIdx])};
  $("lb-del").onclick=function(){
    if(lbIdx<0)return;
    var p=lbList[lbIdx];
    if(p.uploader!==me){toast("내가 올린 사진만 지울 수 있습니다");return}
    if(!confirm("이 사진을 지웁니다. 되돌릴 수 없습니다."))return;
    removePhotos([p.id]).then(function(){closeLb();renderCat()});
  };
  $("lb").onclick=function(e){if(e.target===$("lb"))closeLb()};

  document.addEventListener("keydown",function(e){
    if($("lb").hidden)return;
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
  });

  var depth=0;
  window.addEventListener("dragenter",function(e){
    if(view!=="cat")return;
    e.preventDefault();depth++;
    var f=folder?folders.filter(function(x){return x.id===folder})[0]:null;
    $("drop-where").textContent="["+catOf(cat).name+(f?" · "+f.name:"")+"]";
    $("drop").hidden=false;
  });
  window.addEventListener("dragover",function(e){e.preventDefault()});
  window.addEventListener("dragleave",function(){depth--;if(depth<=0){depth=0;$("drop").hidden=true}});
  window.addEventListener("drop",function(e){
    e.preventDefault();depth=0;$("drop").hidden=true;
    if(view!=="cat")return;
    if(e.dataTransfer&&e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);
  });
  window.addEventListener("paste",function(e){
    if(view!=="cat"||!e.clipboardData)return;
    var fs=[];
    Array.prototype.forEach.call(e.clipboardData.items,function(it){
      if(it.kind==="file"){var f=it.getAsFile();if(f)fs.push(f)}
    });
    if(fs.length)handleFiles(fs);
  });

  var t=null;
  window.addEventListener("resize",function(){
    if(view!=="cat")return;
    clearTimeout(t);t=setTimeout(renderGrid,140);
  });
  window.addEventListener("hashchange",route);
}
function moveTo(fid){
  if(!sel.length)return;
  sb.from("photos").update({folder:fid}).in("id",sel).then(function(r){
    if(r.error){toast("옮기지 못했습니다");return}
    photos.forEach(function(p){if(sel.indexOf(p.id)>=0)p.folder=fid});
    clearSel();renderCat();
  });
}

/* ================= 시작 ================= */
function start(){
  $("gate").hidden=true;
  renderHeader();
  connect();
  route();
  if(view==="home")loadHome();
}
function saveName(){
  var v=$("gate-in").value.trim().slice(0,12);
  if(!v){$("gate-in").focus();return}
  me=v;
  try{localStorage.setItem("ref-me",v)}catch(e){}
  start();
}

if(!window.supabase||!window.supabase.createClient){
  document.body.innerHTML='<div style="padding:60px 24px;font-size:14px;line-height:2">연결에 필요한 파일을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>';
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  try{me=localStorage.getItem("ref-me")||""}catch(e){me=""}
  wire();
  if(me){start()}
  else{
    $("gate-go").onclick=saveName;
    $("gate-in").onkeydown=function(e){if(e.key==="Enter"&&!e.isComposing)saveName()};
    $("gate-in").focus();
  }
}
})();
</script>
</body>
</html>
