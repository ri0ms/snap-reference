<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reference — 스냅사진 레퍼런스 보드</title>
<meta name="description" content="스냅사진 레퍼런스를 6개 컨셉으로 나눠 모으는 보드.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128247;</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Parisienne&display=swap">
<style>
:root{
  --paper:#F2F2F0;
  --surface:#FFFFFF;
  --ph:#E6E6E3;
  --ink:#111111;
  --ink60:#6B6B68;
  --ink35:#A5A5A0;
  --line:#DCDCD8;
  --live:#2563EB;
  --live-soft:#DCE8FF;
  /* 강조색 — 제목과 "누를 수 있는 것"에만. 배경·카드 같은 넓은 면에는 쓰지 않습니다 */
  --accent:#0D7370;
  --gx:26px;
  --font:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --display:"DM Serif Display","Playfair Display",Georgia,serif;
  --script:"Parisienne","Snell Roundhand","Apple Chancery",cursive;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font);font-size:14px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}

/* ---------- header ---------- */
#hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--paper);
  height:56px;display:flex;align-items:center;gap:16px;
  padding-inline:var(--gx);
}
#hdr .brand{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.02em;flex:none}
#hdr nav{
  flex:1;display:flex;gap:30px;justify-content:center;
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
#hdr nav::-webkit-scrollbar{display:none}
#hdr nav button{
  font-family:var(--script);font-size:20px;font-weight:400;letter-spacing:.01em;
  line-height:1.25;color:var(--ink60);white-space:nowrap;
  /* 2px 로 고정 — 선택 시 굵기가 바뀌면 글자가 1px 밀립니다 */
  padding-bottom:6px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:5px;
}
#hdr nav button:hover{color:var(--accent)}
#hdr nav button.cur{color:var(--accent);border-bottom-color:var(--accent)}
#hdr .who{
  flex:none;font-size:11.5px;color:var(--ink60);letter-spacing:.04em;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
#hdr .who .peer{display:flex;align-items:center;gap:5px}
@media (max-width:767px){#hdr .who{display:none}}
/* 사람 표시 점 — 닉네임마다 색이 다릅니다 (색은 JS 에서 넣습니다) */
.dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none;display:inline-block}

/* 사진 오른쪽 위, 누가 올렸는지 알려주는 동그라미.
   어떤 사진 위에도 보이도록 흰 테두리를 두릅니다. */
.tile .who{
  position:absolute;top:8px;right:8px;
  width:11px;height:11px;border-radius:50%;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.92), 0 1px 3px rgba(17,17,17,.3);
  pointer-events:none;
}

/* ---------- home ---------- */
.wrap{padding-inline:var(--gx);max-width:1600px;margin:0 auto}
.hero{text-align:center;padding-block:76px 26px}
.hero h1{
  margin:0;font-family:var(--display);color:var(--accent);
  font-size:clamp(34px,9vw,122px);font-weight:400;
  letter-spacing:.006em;word-spacing:-.01em;line-height:.98;white-space:nowrap;
  font-feature-settings:"kern" 1;
}
.hero .meta{margin:12px 0 0;font-size:11.5px;letter-spacing:.10em;color:var(--ink60)}
.hero .warn{
  margin:14px 0 0;font-size:11px;letter-spacing:.02em;color:var(--ink35);
}

.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding-bottom:26px}
.cat{display:flex;flex-direction:column;text-align:left;width:100%}
.cat .thumb{
  aspect-ratio:3/4;background:var(--ph);position:relative;overflow:hidden;
  display:grid;place-items:center;
}
.cat .thumb img{width:100%;height:100%;object-fit:cover;transition:filter .16s}
.cat:hover .thumb img{filter:brightness(.96)}
.cat .lb .n{transition:color .16s}
.cat:hover .lb .n{color:var(--accent)}
.cat .thumb .none{font-size:11px;color:var(--ink35);letter-spacing:.04em}
/* 라벨은 절대 두 줄이 되지 않게 합니다 —
   한 카드만 접혀도 같은 행 전체가 높아져 카드 높이가 어긋납니다 */
.cat .lb{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:nowrap;min-width:0}
.cat .lb .n{
  font-family:var(--script);font-size:22px;font-weight:400;letter-spacing:.01em;line-height:1.25;
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cat .lb .c{font-size:11.5px;font-weight:500;color:var(--ink60);font-variant-numeric:tabular-nums;flex:none}

.slider{display:none;justify-content:center;padding-bottom:30px}
.slider .trk{width:200px;height:1px;background:var(--line);position:relative}
.slider .hd{position:absolute;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid var(--ink);transform:translateX(-50%)}

/* ---------- category view ---------- */
.ctitle{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding-block:30px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.ctitle .l{display:flex;align-items:baseline;gap:9px}
.ctitle h2{margin:0;font-family:var(--display);font-size:34px;font-weight:400;letter-spacing:.012em}
.ctitle .c{font-size:11.5px;color:var(--ink60);font-variant-numeric:tabular-nums}
.ctitle .r{display:flex;gap:12px;align-items:center}
.ctitle .r #btn-upload{font-size:13px;margin-right:4px}
.ctitle .r #btn-upload:hover{text-decoration:underline;text-underline-offset:3px}

/* 흰색 라운드 버튼 */
.pill{
  background:var(--surface);color:var(--ink);
  border-radius:999px;padding:6px 16px;
  font-size:13px;line-height:1.5;white-space:nowrap;
  box-shadow:0 1px 2px rgba(17,17,17,.05), 0 2px 10px rgba(17,17,17,.05);
  transition:box-shadow .16s, background .16s, color .16s;
}
.pill:hover{box-shadow:0 2px 4px rgba(17,17,17,.09), 0 4px 14px rgba(17,17,17,.08)}
.pill:active{box-shadow:0 1px 2px rgba(17,17,17,.06)}
.pill.on{background:var(--ink);color:var(--paper)}
.pill.quiet{color:var(--ink35)}

.chips{display:flex;gap:20px;align-items:center;padding-block:12px 22px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  font-size:13px;color:var(--ink60);white-space:nowrap;
  /* 위 3px = 아래 2px + 밑줄 1px — 알약 버튼과 글자 높이를 맞추기 위한 대칭 여백 */
  padding:3px 0 2px;border-bottom:1px solid transparent;
}
.chips button:hover{color:var(--ink)}
.chips button.cur{color:var(--ink);border-bottom-color:var(--ink)}
/* .chips button 의 padding-bottom 이 .pill 을 덮어써 글자가 위로 치우치던 것 복구 */
.chips button.pill{padding:6px 16px;border-bottom:0}
.chips button.add{color:var(--ink);margin-left:4px}
.chips input{
  border:0;border-bottom:1px solid var(--ink);background:none;
  font-size:13px;width:110px;padding:0 0 2px;outline:none;
}
.chips .err{font-size:11px;color:var(--ink60);align-self:center}

#grid{padding-bottom:80px}
.row{display:flex;gap:18px;margin-bottom:18px}
.tile{position:relative;background:var(--ph);overflow:hidden;flex:none}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease-out,filter .16s}
.tile img.on{opacity:1}
.tile:hover img{filter:brightness(.96)}
.tile.live{outline:1px solid var(--live);outline-offset:-1px}
.tile .cap{
  position:absolute;left:0;right:0;bottom:0;padding:7px 9px;
  font-size:11px;color:#fff;letter-spacing:.02em;
  background:rgba(17,17,17,.42);opacity:0;transition:opacity .16s;
  pointer-events:none;
}
.tile:hover .cap{opacity:1}
.tile .pick{
  position:absolute;top:8px;left:8px;width:16px;height:16px;
  border:1px solid rgba(255,255,255,.9);background:rgba(17,17,17,.25);
  display:grid;place-content:center;opacity:0;transition:opacity .16s;
}
.tile:hover .pick,.tile.sel .pick,body.picking .tile .pick{opacity:1}
.tile.sel .pick{background:var(--ink);border-color:var(--ink)}
.tile.sel .pick::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tile .bar{position:absolute;left:0;bottom:0;height:1px;background:var(--live);width:0;transition:width .2s}

.empty{
  border:1px dashed var(--line);height:260px;display:grid;place-content:center;
  text-align:center;color:var(--ink60);font-size:13px;line-height:2;
}

/* ---------- selection bar ---------- */
#selbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:var(--surface);border-top:1px solid var(--line);
  min-height:52px;display:flex;align-items:center;gap:20px;
  padding:10px var(--gx);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  flex-wrap:wrap;
}
#selbar .n{font-size:13px;font-weight:500;flex:none}
#selbar button{font-size:13px;color:var(--ink60)}
#selbar button:hover{color:var(--ink)}
#selbar .sp{flex:1}
#selbar .warn{font-size:11px;color:var(--ink35);width:100%}
.menu{
  position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);
  min-width:150px;padding:6px 0;
}
.menu button{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px}
.menu button:hover{background:var(--paper)}

/* ---------- drop overlay ---------- */
#drop{
  position:fixed;inset:0;z-index:60;display:grid;place-content:center;text-align:center;
  background:rgba(242,242,240,.93);
}
#drop .in{border:1px dashed var(--ink);padding:56px 64px;font-size:18px;font-weight:300;line-height:1.8}
#drop b{font-weight:500}

/* ---------- lightbox ---------- */
#lb{
  /* 검정 딤이 아니라 종이색 — 사진의 색·톤을 그대로 판단하기 위해서입니다.
     반투명으로 두면 뒤쪽 헤더 글자가 비쳐 지저분해 불투명으로 씁니다. */
  position:fixed;inset:0;z-index:70;background:var(--paper);
  display:grid;grid-template-rows:1fr;overflow:auto;
}
#lb .inner{
  display:grid;grid-template-columns:1fr 320px;gap:32px;
  padding:56px var(--gx) 32px;align-items:start;min-height:100%;
}
#lb .stage{display:grid;place-items:center;position:relative;min-height:50vh}
#lb .stage img{max-width:100%;max-height:82vh;width:auto;height:auto;object-fit:contain;cursor:zoom-in}
#lb .nav{position:absolute;inset:auto 0 -34px 0;display:flex;gap:22px;justify-content:center;font-size:18px;color:var(--ink60)}
#lb .nav button:hover{color:var(--ink)}
#lb .side{display:flex;flex-direction:column;gap:14px;padding-top:4px}
#lb .side .where{font-size:13px}
#lb .side .meta{font-size:11.5px;color:var(--ink60);letter-spacing:.04em}
#lb .side hr{border:0;border-top:1px solid var(--line);margin:2px 0}
#lb .side h3{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.10em;color:var(--ink60)}
#lb .cmts{display:flex;flex-direction:column;gap:9px;max-height:38vh;overflow-y:auto}
#lb .cmt{font-size:13px;line-height:1.6;position:relative;padding-right:20px}
#lb .cmt .del{
  position:absolute;right:0;top:-1px;
  font-size:15px;line-height:1.3;color:var(--ink35);
  opacity:0;transition:opacity .16s,color .16s;
}
#lb .cmt:hover .del{opacity:1}
#lb .cmt .del:hover{color:var(--ink)}
/* 터치 기기에는 호버가 없어 항상 보입니다 */
@media (hover:none){#lb .cmt .del{opacity:1}}
#lb .cmt b{font-weight:500;margin-right:7px}
#lb .cmt span{color:var(--ink60)}
#lb .cmt .t{font-size:10.5px;color:var(--ink35);margin-left:6px}
#lb .box{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
#lb .box input{flex:1;border:0;background:none;outline:none;font-size:13px}
#lb .box button{font-size:12px;color:var(--ink60);flex:none}
#lb .acts{display:flex;gap:18px;font-size:13px;color:var(--ink60);padding-top:4px;flex-wrap:wrap}
#lb .acts button:hover{color:var(--ink)}
#lb .acts button.on{color:var(--accent)}
#lb .close{position:fixed;top:16px;right:20px;font-size:22px;line-height:1;color:var(--ink60);z-index:2}
#lb .close:hover{color:var(--ink)}

/* ---------- name gate ---------- */
#gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:grid;place-content:center;text-align:center;padding:20px}
#gate .t{font-family:var(--display);color:var(--accent);font-size:clamp(32px,7.4vw,60px);font-weight:400;letter-spacing:.006em;line-height:.98;margin:0 0 14px}
#gate p{margin:0 0 30px;font-size:13px;color:var(--ink60)}
#gate .f{display:flex;gap:12px;justify-content:center;align-items:baseline}
#gate input{border:0;border-bottom:1px solid var(--ink);background:none;outline:none;font-size:16px;width:170px;text-align:center;padding-bottom:6px}
#gate button{font-size:13px;border-bottom:1px solid var(--ink);padding-bottom:2px}

/* ---------- responsive ---------- */
@media (max-width:1279px){
  .strip{
    /* 185px — 가장 긴 라벨이 잘리지 않는 최소 폭 */
    grid-template-columns:repeat(6,minmax(185px,1fr));
    overflow-x:auto;scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .slider{display:flex}
}
@media (max-width:1023px){
  .strip{grid-template-columns:repeat(3,1fr);overflow:visible;row-gap:26px}
  .slider{display:none}
  #lb .inner{grid-template-columns:1fr;gap:22px}
  #lb .stage img{max-height:62vh}
  #lb .cmts{max-height:none}
}
@media (max-width:767px){
  :root{--gx:16px}
  /* 브랜드와 탭이 붙어 보이지 않도록 간격을 벌립니다 */
  #hdr{gap:22px;height:60px}
  /* scroll-behavior:smooth 는 넣지 않습니다 — 선택한 탭을 가운데로 옮기는
     프로그램 스크롤이 먹지 않습니다(즉시 이동이 더 확실합니다) */
  #hdr nav{justify-content:flex-start;gap:26px}
  /* 탭이 옆으로 밀릴 때 브랜드 바로 옆에 달라붙지 않도록 */
  #hdr nav::after{content:"";flex:none;width:4px}
  .hero{padding-block:44px 20px}
  .hero h1{white-space:normal}
  /* 카드 폭 168px 안에 가장 긴 'Wedding Studio' 까지 한 줄로 들어가는 크기 */
  .strip{grid-template-columns:repeat(2,1fr);gap:8px;row-gap:22px}
  .cat .lb .n{font-size:19px}
  /* 제목 줄과 버튼 줄을 항상 나눕니다 —
     제목 길이에 따라 어떤 카테고리는 1줄, 어떤 건 2줄이 되는 것을 막습니다 */
  .ctitle{flex-direction:column;align-items:flex-start;gap:14px;padding-block:24px 12px}
  .ctitle .r{width:100%}
  .ctitle h2{font-size:22px}
  #lb .inner{padding-top:48px}
  #lb .stage img{max-height:56vh}
}
/* ---------- 보기 전용 모드 (?view) ----------
   편집 수단을 화면에서 전부 걷어냅니다. 서버 규칙으로 막는 것이 아니라
   화면에서만 감추는 방식이라, 개발자 도구를 다루는 사람은 우회할 수 있습니다. */
body.ro #btn-upload,
body.ro #btn-pick,
body.ro #btn-del,
body.ro #selbar,
body.ro #drop,
body.ro .chips button.add,
body.ro .tile .pick,
body.ro #lb-cmt-block,
body.ro #lb-cover,
body.ro #lb-cat,
body.ro #lb-del,
body.ro #hdr .who{display:none!important}
body.ro .ctitle{padding-bottom:14px}

/* ---------- 전체 화면으로 크게 보기 ----------
   크게 보기(#lb)에서 사진을 한 번 더 누르면 열립니다.
   댓글·버튼 없이 사진만 화면 끝까지 채웁니다. */
#zoom{
  position:fixed;inset:0;z-index:85;background:var(--paper);
  display:grid;place-items:center;
  overflow:auto;-webkit-overflow-scrolling:touch;
}
#zoom img{
  max-width:100vw;max-height:100vh;width:auto;height:auto;
  object-fit:contain;display:block;cursor:zoom-in;
}
/* 한 번 더 누르면 2배로 키우고, 밀어서 구석구석 봅니다 */
#zoom.mag{place-items:start}
#zoom.mag img{max-width:none;max-height:none;width:200vw;height:auto;cursor:zoom-out}
#zoom .close{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;
  font-size:28px;line-height:1;color:var(--ink60);padding:6px 10px;z-index:2;
}
#zoom .close:hover{color:var(--ink)}

/* ---------- 알림 ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;
  background:var(--ink);color:var(--paper);
  font-size:13px;line-height:1.5;padding:10px 18px;border-radius:999px;
  max-width:calc(100vw - 32px);text-align:center;
  box-shadow:0 2px 14px rgba(17,17,17,.18);
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header id="hdr">
  <button class="brand" id="home-link">Reference</button>
  <nav id="nav"></nav>
  <span class="who" id="who"></span>
</header>

<main>
  <section id="view-home" class="wrap">
    <div class="hero">
      <h1>SNAP REFERENCE</h1>
      <p class="meta" id="home-meta">[ ALL · 0 PHOTOS ]</p>
    </div>
    <div class="strip" id="strip"></div>
    <div class="slider"><div class="trk"><div class="hd" id="sl-hd" style="left:12%"></div></div></div>
  </section>

  <section id="view-cat" class="wrap" hidden>
    <div class="ctitle">
      <span class="l"><h2 id="cat-name">PERSONAL</h2><span class="c" id="cat-count">[0]</span></span>
      <span class="r">
        <button id="btn-upload">↑ 사진 올리기</button>
        <button id="btn-pick" class="pill">전체</button>
        <button id="btn-del" class="pill quiet">삭제</button>
      </span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="grid"></div>
  </section>
</main>

<div id="selbar" hidden>
  <span class="n" id="sel-n">0장 선택</span>
  <button id="sel-move">폴더로 이동</button>
  <button id="sel-cat">카테고리로 이동</button>
  <button id="sel-dl">다운로드</button>
  <button id="sel-del">삭제</button>
  <span class="sp"></span>
  <button id="sel-off">선택 해제</button>

/* 사람 색 —— 이름을 해시해서 고르면 두 글자 한글끼리 색이 자주 겹칩니다.

   6명까지는 절대 겹치지 않습니다. */
var PERSON_COLORS=["#E0563B","#2F7FD4","#3F9E6B","#C9A227","#8B5FBF","#D4608F"];
var peopleKnown=[],peopleColors={};
function notePeople(names){
  var added=false;
  names.forEach(function(n){
    if(n&&peopleKnown.indexOf(n)<0){peopleKnown.push(n);added=true}
  });
  if(added){
    peopleColors={};
    peopleKnown.slice().sort().forEach(function(n,i){
      peopleColors[n]=PERSON_COLORS[i%PERSON_COLORS.length];
    });

  return added;
}

function when(ts){
  var t=new Date(ts).getTime();
  var d=(Date.now()-t)/1000;
  if(d<60)return "방금";
  if(d<3600)return Math.floor(d/60)+"분 전";
  if(d<86400)return Math.floor(d/3600)+"시간 전";
  var x=new Date(t);
  return x.getFullYear()+"."+String(x.getMonth()+1).padStart(2,"0")+"."+String(x.getDate()).padStart(2,"0");
}

    setTimeout(function(){centerTab(true)},260);

/* 선택된 탭을 탭 줄의 가운데로 끌어옵니다.
   휴대폰에서 뒤쪽 카테고리를 누르려고 손으로 미는 수고를 없앱니다. */
/* 선택한 탭을 탭 줄 가운데로 부드럽게 옮깁니다.
   CSS scroll-behavior 나 scrollTo({behavior:"smooth"}) 는 환경에 따라
   아예 움직이지 않는 경우가 있어, 타이머로 직접 그립니다. */
var tabAnim=null;
function centerTab(instant){
  var nav=$("nav");
  if(!nav)return;
  var b=nav.querySelector("button.cur");
  if(!b)return;
  var max=nav.scrollWidth-nav.clientWidth;
  if(max<=0)return;                   /* 다 보이면 움직일 필요 없음 */
  /* offsetLeft 는 #hdr 기준이라 쓸 수 없습니다 — 화면 좌표로 직접 구합니다 */
  var nr=nav.getBoundingClientRect(),br=b.getBoundingClientRect();
  var inner=br.left-nr.left+nav.scrollLeft;
  var target=Math.max(0,Math.min(inner-(nav.clientWidth-br.width)/2,max));
  var from=nav.scrollLeft;

  if(tabAnim){clearInterval(tabAnim);tabAnim=null}

  var reduce=false;
  try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  if(instant||reduce||Math.abs(target-from)<2){nav.scrollLeft=target;return}

  var t0=Date.now(),dur=320;
  tabAnim=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/dur);
    var e=1-Math.pow(1-k,3);          /* 빠르게 출발해 부드럽게 멈춤 */
    nav.scrollLeft=from+(target-from)*e;
    if(k>=1){clearInterval(tabAnim);tabAnim=null}
  },16);
}
function renderPeers(){

/* ================= 보드 홈 ================= */
/* covers 표가 아직 없어도 앱이 멈추지 않도록, 실패하면 빈 값으로 넘어갑니다 */
function loadCovers(){

  ]).then(function(res){

    rows.forEach(function(p){
      byId[p.id]=p;
      if(!byCat[p.cat])byCat[p.cat]={n:0,cover:null};
      byCat[p.cat].n++;

    });

    Object.keys(covers).forEach(function(k){

/* ================= 카테고리 ================= */
function loadCat(){
  return Promise.all([
    sb.from("photos").select("*").eq("cat",cat).order("created_at",{ascending:false}),
    sb.from("folders").select("*").eq("cat",cat).order("created_at",{ascending:true}),
    loadCovers()
  ]).then(function(r){

    photos=r[0].data||[];
    folders=r[1].data||[];

}
function visible(){

  return photos.filter(function(p){return p.folder===folder});
}

function renderChips(){
  var box=$("chips");
  box.innerHTML="";
  var all=el("button");
  if(!folder)all.className="cur";
  all.textContent="전체";
  all.onclick=function(){folder=null;clearSel();renderGrid();renderChips()};
  box.appendChild(all);

  folders.forEach(function(f){
    var b=el("button");
    if(folder===f.id)b.className="cur";
    b.textContent=f.name;
    b.onclick=function(){folder=f.id;clearSel();renderGrid();renderChips()};
    if(!RO)bindFolderMenu(b,f);
    box.appendChild(b);
  });

  var add=el("button","add pill");
  add.textContent="+ 폴더";
  add.onclick=function(){newFolderInput(box,add)};
  box.appendChild(add);
}
function newFolderInput(box,add){
  add.hidden=true;
  var inp=el("input");
  inp.placeholder="폴더 이름";
  inp.maxLength=12;
  var err=el("span","err");
  err.hidden=true;
  box.appendChild(inp);
  box.appendChild(err);
  inp.focus();
  function done(){add.hidden=false;inp.remove();err.remove()}
  inp.onkeydown=function(e){
    if(e.key==="Escape"){done();return}
    if(e.key!=="Enter"||e.isComposing)return;
    var name=inp.value.trim();
    if(!name){done();return}
    if(folders.some(function(f){return f.name===name})){
      err.hidden=false;err.textContent="같은 이름의 폴더가 있습니다";
      return;
    }
    var rec={id:uid(),cat:cat,name:name};
    sb.from("folders").insert(rec).then(function(r){
      if(r.error){toast("폴더를 만들지 못했습니다");return}
      folders.push(rec);
      done();
      renderChips();
    });
  };
  inp.onblur=function(){setTimeout(done,150)};
}
function folderMenu(e,f){
  closeMenu();
  var m=el("div","menu");
  m.id="fmenu";
  var r=el("button");r.textContent="이름 바꾸기";
  r.onclick=function(){
    var v=prompt("새 폴더 이름",f.name);
    closeMenu();
    if(!v)return;
    v=v.trim().slice(0,12);
    if(!v)return;
    sb.from("folders").update({name:v}).eq("id",f.id).then(function(res){
      if(res.error){toast("이름을 바꾸지 못했습니다");return}
      f.name=v;renderChips();
    });
  };
  var d=el("button");d.textContent="삭제";
  d.onclick=function(){
    closeMenu();
    if(!confirm("폴더 “"+f.name+"” 를 지웁니다.\n안의 사진은 지워지지 않고 [전체]에 남습니다."))return;
    sb.from("photos").update({folder:null}).eq("folder",f.id)
      .then(function(){return sb.from("folders").delete().eq("id",f.id)})
      .then(function(res){
        if(res&&res.error){toast("폴더를 지우지 못했습니다");return}
        photos.forEach(function(p){if(p.folder===f.id)p.folder=null});
        folders=folders.filter(function(x){return x.id!==f.id});
        if(folder===f.id)folder=null;
        renderChips();renderGrid();
      });
  };
  m.appendChild(r);m.appendChild(d);
  openMenu(m,e.clientX,e.clientY);
}

/* 폴더 칩에 메뉴를 붙입니다 — 데스크톱은 우클릭, 휴대폰은 길게 누르기 */
function bindFolderMenu(b,f){
  b.oncontextmenu=function(e){e.preventDefault();folderMenu(e,f)};
  var timer=null,moved=false,fired=false;
  b.addEventListener("touchstart",function(e){
    moved=false;fired=false;
    var t=e.touches[0],x=t.clientX,y=t.clientY;
    timer=setTimeout(function(){
      timer=null;
      if(moved)return;
      fired=true;
      folderMenu({clientX:x,clientY:y},f);
    },500);
  },{passive:true});
  b.addEventListener("touchmove",function(){
    moved=true;
    if(timer){clearTimeout(timer);timer=null}
  },{passive:true});
  b.addEventListener("touchend",function(){
    if(timer){clearTimeout(timer);timer=null}
  },{passive:true});
  /* 길게 눌러 메뉴를 연 뒤 따라오는 클릭이 폴더를 바꾸지 않도록 막습니다 */
  b.addEventListener("click",function(e){
    if(fired){e.preventDefault();e.stopPropagation();fired=false}
  },true);
}
/* 메뉴 열고 닫기 —— 바깥을 누르면 닫습니다.
   click 이 아니라 pointerdown 을 쓰는 이유: 터치에서는 길게 누른 뒤
   이어지는 click 때문에 메뉴가 열리자마자 닫혀 버립니다. */
function onDocDown(e){
  var m=$("fmenu");
  if(m&&m.contains(e.target))return;
  closeMenu();
}
function openMenu(m,x,y){
  closeMenu();
  m.id="fmenu";
  document.body.appendChild(m);
  m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+"px";
  var top=y;
  if(top+m.offsetHeight>innerHeight-8)top=Math.max(8,innerHeight-m.offsetHeight-8);
  m.style.top=top+"px";
  setTimeout(function(){document.addEventListener("pointerdown",onDocDown)},0);
}
function closeMenu(){
  var m=$("fmenu");
  if(m)m.remove();
  document.removeEventListener("pointerdown",onDocDown);
}

/* ================= 저스티파이드 그리드 ================= */
function layoutRows(items,cw,targetH,gap){
  var rows=[],row=[],sum=0;
  for(var i=0;i<items.length;i++){
    row.push(items[i]);sum+=(items[i].ratio||1);
    var h=(cw-gap*(row.length-1))/sum;
    if(h<=targetH){rows.push({items:row,height:h});row=[];sum=0}
  }
  if(row.length)rows.push({items:row,height:targetH,last:true});
  return rows;
}
function targetHeight(){
  var w=innerWidth;
  if(w>=1280)return 260;
  if(w>=1024)return 220;
  return 180;
}
function renderGrid(){
  var g=$("grid");
  g.innerHTML="";
  if(io){io.disconnect();io=null}
  var list=visible();
  lbList=list;

  if(!list.length){
    var e=el("div","empty");
    e.innerHTML=folder
      ? "이 폴더는 비어 있습니다.<br>사진을 선택해 옮겨보세요."
      : "아직 사진이 없습니다.<br>파일을 여기로 끌어다 놓으세요.";
    g.appendChild(e);
    return;
  }

  io=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(!en.isIntersecting)return;
      var t=en.target;
      io.unobserve(t);
      var img=t.querySelector("img");
      if(img&&!img.src){
        img.src=t.dataset.url;
        img.onload=function(){img.classList.add("on")};
      }
    });
  },{rootMargin:"300px 0px"});

  var cw=g.clientWidth||(innerWidth-52);
  var gap=18,mobile=innerWidth<768;

  if(mobile){
    /* 2열 고정 그리드 — 좁은 폭에서는 저스티파이드가 널뜀 */
    var cols=[[],[]],hs=[0,0];
    list.forEach(function(p){
      var k=hs[0]<=hs[1]?0:1;
      cols[k].push(p);hs[k]+=1/(p.ratio||1);
    });
    var row=el("div","row");
    row.style.gap="8px";
    row.style.alignItems="flex-start";
    cols.forEach(function(col){
      var c=el("div");
      c.style.flex="1";c.style.display="flex";c.style.flexDirection="column";c.style.gap="8px";
      c.style.minWidth="0";
      col.forEach(function(p){
        var t=tile(p);
        t.style.width="100%";
        t.style.aspectRatio=(p.ratio||1);
        t.style.height="auto";
        c.appendChild(t);
      });
      row.appendChild(c);
    });
    g.appendChild(row);
    return;
  }

  layoutRows(list,cw,targetHeight(),gap).forEach(function(r){
    var row=el("div","row");
    r.items.forEach(function(p){
      var t=tile(p);
      t.style.height=r.height+"px";
      t.style.width=(r.height*(p.ratio||1))+"px";
      row.appendChild(t);
    });
    g.appendChild(row);
  });
}
function tile(p){
  var t=el("div","tile");
  t.dataset.id=p.id;
  t.dataset.url=publicUrl(p.path);
  if(sel.indexOf(p.id)>=0)t.classList.add("sel");
  if(p.fresh)t.classList.add("live");

  var img=el("img");
  img.alt=catOf(p.cat).name+" 카테고리 사진, "+p.uploader+" 업로드";
  t.appendChild(img);

  var cap=el("div","cap");
  cap.textContent="["+p.uploader+" · "+when(p.created_at)+"]";
  t.appendChild(cap);

  var who=el("div","who");
  who.style.background=personColor(p.uploader);
  who.title=p.uploader;
  t.appendChild(who);

  var pick=el("div","pick");
  pick.onclick=function(e){e.stopPropagation();toggleSel(p.id,t)};
  t.appendChild(pick);

  t.onclick=function(){
    if(!RO&&(picking||sel.length)){toggleSel(p.id,t);return}
    openLb(lbList.indexOf(p));
  };
  if(io)io.observe(t);
  return t;
}

function toggleSel(id,node){

function clearSel(){

function syncSel(){
  var bar=$("selbar"),d=$("btn-del"),p=$("btn-pick");
  bar.hidden=sel.length===0;

  if(d){

       선택한 장수는 하단 바("12장 선택")가 알려줍니다. */

/* ================= 업로드 ================= */
function processImage(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file);
    var im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight;
      if(!w||!h){URL.revokeObjectURL(url);res(null);return}
      var ratio=w/h;
      var scale=Math.min(1,MAX_EDGE/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
      var c=document.createElement("canvas");
      c.width=cw;c.height=ch;
      c.getContext("2d").drawImage(im,0,0,cw,ch);
      c.toBlob(function(b){
        URL.revokeObjectURL(url);
        res(b?{blob:b,ratio:ratio}:null);
      },"image/jpeg",JPEG_Q);
    };
    im.onerror=function(){URL.revokeObjectURL(url);res(null)};
    im.src=url;
  });
}
function handleFiles(files){
  if(RO)return;
  var arr=Array.prototype.slice.call(files);
  var tooBig=false,notImage=false;
  var good=arr.filter(function(f){
    if(!/^image\//.test(f.type)){notImage=true;return false}
    if(f.size>MAX_FILE){tooBig=true;return false}
    return true;
  });
  if(notImage)toast("이미지 파일만 올릴 수 있습니다 (JPG, PNG, WEBP)");
  else if(tooBig)toast("한 장에 15MB까지 올릴 수 있습니다");
  if(!good.length)return;

  var targetCat=cat,targetFolder=folder;
  var chain=Promise.resolve(),failed=0,undecodable=0;

  good.slice(0,PER_BATCH).forEach(function(f){
    chain=chain.then(function(){
      return processImage(f).then(function(d){
        if(!d){undecodable++;return}
        var id=uid(),path=id+".jpg";
        return sb.storage.from(BUCKET).upload(path,d.blob,{contentType:"image/jpeg"})
          .then(function(up){
            if(up.error)throw up.error;
            /* created_at 을 직접 넣습니다 — 서버 기본값에만 맡기면
               방금 올린 사진의 시간이 내 화면에서 NaN 으로 보입니다 */
            var rec={id:id,cat:targetCat,folder:targetFolder,name:f.name,ratio:d.ratio,path:path,uploader:me,created_at:new Date().toISOString()};
            return sb.from("photos").insert(rec).then(function(ins){
              if(ins.error)throw ins.error;
              if(view==="cat"&&cat===targetCat&&!byId(id)){
                photos.unshift(rec);
                renderCat();
              }
            });
          })
          .catch(function(){failed++});
      });
    });
  });

  chain.then(function(){
    if(undecodable)toast(undecodable+"장은 이 브라우저가 열 수 없는 형식입니다 (아이폰 HEIC 등)");
    else if(failed)toast(failed+"장을 올리지 못했습니다. 다시 시도해 주세요");
  });
}

/* ================= 라이트박스 ================= */
function openLb(i){
  if(i<0||i>=lbList.length)return;
  lbIdx=i;
  var p=lbList[i];
  $("lb").hidden=false;
  document.body.style.overflow="hidden";
  /* 휴대폰 뒤로 가기로 닫을 수 있게 방문 기록을 하나 쌓습니다.
     사진을 넘길 때(‹ ›)는 이미 쌓여 있으므로 다시 쌓지 않습니다. */
  if(!lbPushed){
    try{history.pushState({lb:1},"",location.href);lbPushed=true}catch(e){}
  }
  var img=$("lb-img");
  img.removeAttribute("src");
  img.alt=catOf(p.cat).name+" 사진";
  img.src=publicUrl(p.path);
  var f=p.folder?folders.filter(function(x){return x.id===p.folder})[0]:null;
  $("lb-where").textContent=catOf(p.cat).name+(f?" · "+f.name:"");
  $("lb-meta").textContent="["+p.uploader+" · "+when(p.created_at)+"]";
  $("lb-cmts").innerHTML="";
  if(RO)return;                 /* 보기 전용에서는 내부 대화(댓글)를 노출하지 않습니다 */
  syncCoverBtn(p);
  loadComments(p.id);
}
function syncCoverBtn(p){
  var b=$("lb-cover"),isCover=covers[p.cat]===p.id;
  b.textContent=isCover?"★ 대표 사진":"대표로 지정";
  b.classList.toggle("on",isCover);
}
function loadComments(photoId){
  return sb.from("comments").select("*").eq("photo_id",photoId).order("created_at",{ascending:true})
    .then(function(r){
      if(lbIdx<0||lbList[lbIdx].id!==photoId)return;
      renderCmts(r.data||[]);
    });
}
function renderCmts(rows){
  var box=$("lb-cmts");
  box.innerHTML="";
  rows.forEach(function(c){
    var d=el("div","cmt");
    var b=el("b");b.textContent=c.who;
    var s=el("span");s.textContent=c.body;
    var t=el("span","t");t.textContent=when(c.created_at);
    d.appendChild(b);d.appendChild(s);d.appendChild(t);
    /* 내가 쓴 댓글만 지울 수 있습니다 — 사진과 같은 규칙 */
    if(!RO&&c.who===me){
      var x=el("button","del");
      x.textContent="×";
      x.title="댓글 지우기";
      x.setAttribute("aria-label","댓글 지우기");
      x.onclick=function(){
        if(!confirm("이 댓글을 지웁니다."))return;
        sb.from("comments").delete().eq("id",c.id).then(function(r){
          if(r.error){toast("댓글을 지우지 못했습니다");return}
          loadComments(c.photo_id);
        });
      };
      d.appendChild(x);
    }
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
/* 전체 화면 — 크게 보기 위에 한 겹 더 쌓입니다.
   뒤로 가기는 맨 위 한 겹씩만 닫습니다. */
function openZoom(){
  if(lbIdx<0)return;
  var p=lbList[lbIdx];
  var img=$("zoom-img");
  img.src=publicUrl(p.path);
  img.alt=catOf(p.cat).name+" 사진";
  $("zoom").hidden=false;
  if(!zoomPushed){
    try{history.pushState({zoom:1},"",location.href);zoomPushed=true}catch(e){}
  }
}
function closeZoom(fromBack){
  $("zoom").hidden=true;
  $("zoom").classList.remove("mag");
  $("zoom-img").removeAttribute("src");
  if(zoomPushed){
    zoomPushed=false;
    if(!fromBack){try{history.back()}catch(e){}}
  }
}
function closeLb(fromBack){
  $("lb").hidden=true;lbIdx=-1;document.body.style.overflow="";
  if(lbPushed){
    lbPushed=false;
    /* 뒤로 가기로 닫힌 경우엔 이미 기록이 소비됐으므로 되돌리지 않습니다 */
    if(!fromBack){try{history.back()}catch(e){}}
  }
}
function stepLb(d){
  if(lbIdx<0)return;
  var n=lbIdx+d;
  if(n<0||n>=lbList.length)return;
  openLb(n);
}
function sendCmt(){
  if(lbIdx<0)return;
  var inp=$("lb-input"),v=inp.value.trim();
  if(!v)return;
  var p=lbList[lbIdx];
  inp.value="";
  sb.from("comments").insert({photo_id:p.id,who:me,body:v}).then(function(r){
    if(r.error){toast("댓글을 남기지 못했습니다");return}
    loadComments(p.id);
  });
}
function download(p){
  var a=el("a");
  a.href=publicUrl(p.path);
  a.download=p.name||(p.id+".jpg");
  a.target="_blank";
  a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
}
function removePhotos(ids){
  var mine=ids.filter(function(id){var p=byId(id);return p&&p.uploader===me});
  if(!mine.length)return Promise.resolve();
  var paths=mine.map(function(id){var p=byId(id);return p?p.path:null}).filter(Boolean);
  return sb.storage.from(BUCKET).remove(paths).then(function(r){
    /* 삭제 정책이 없으면 error 없이 빈 배열이 옵니다 — 조용히 실패하므로 개수로 판단 */
    var removed=(r.data&&r.data.length)||0;
    if((r.error||removed<paths.length)&&!warnedStorage){
      warnedStorage=true;
      toast("목록에서는 지워졌지만 사진 파일이 서버에 남았습니다 — 삭제 정책을 추가해 주세요");
    }
    return sb.from("photos").delete().in("id",mine);
  }).then(function(r){
    if(r.error){toast("지우지 못했습니다");return}
    photos=photos.filter(function(p){return mine.indexOf(p.id)<0});
  });
}

  renderHeader();
  loadCat().then(function(){renderCat();scrollTo(0,0)});

}
function route(){
  var h=location.hash.replace(/^#\/?/,"");
  if(h&&CATS.some(function(c){return c.slug===h})){if(cat!==h||view!=="cat")goCat(h)}
  else if(view!=="home"||!cat)goHome();
}

/* ================= 실시간 ================= */
function connect(){
  chan=sb.channel("board",{config:{presence:{key:uid()}}});
  chan.on("postgres_changes",{event:"INSERT",schema:"public",table:"photos"},function(p){onInsert(p.new)});
  chan.on("postgres_changes",{event:"DELETE",schema:"public",table:"photos"},function(p){onRemove(p.old)});
  /* 카테고리·폴더 이동은 UPDATE 로 들어옵니다 — 어느 쪽으로 옮겼는지 따지지 않고 다시 읽습니다 */
  chan.on("postgres_changes",{event:"UPDATE",schema:"public",table:"photos"},function(){
    if(view==="cat"&&cat)loadCat().then(renderCat);
    else if(view==="home")loadHome();
  });
  chan.on("postgres_changes",{event:"*",schema:"public",table:"comments"},function(p){
    var row=p.new||p.old;
    if(lbIdx>=0&&row&&lbList[lbIdx]&&lbList[lbIdx].id===row.photo_id)loadComments(row.photo_id);
  });
  chan.on("postgres_changes",{event:"*",schema:"public",table:"covers"},function(){
    loadCovers().then(function(){if(view==="home")loadHome()});
  });
  chan.on("presence",{event:"sync"},renderPeers);
  chan.subscribe(function(status){
    /* 보기 전용 방문자와 테스트 접속은 참여자 목록에 넣지 않습니다
       (실시간 갱신은 그대로 받습니다) */
    if(status==="SUBSCRIBED"&&!RO&&!TEST)chan.track({name:me});
  });
}
function onInsert(row){
  if(!row)return;
  if(view==="home"){loadHome();return}
  if(view!=="cat"||row.cat!==cat)return;
  if(byId(row.id))return;
  notePeople([row.uploader]);      /* 처음 보는 사람이면 색을 배정합니다 */
  row.fresh=(row.uploader!==me);
  photos.unshift(row);
  renderCat();
  if(row.fresh){
    setTimeout(function(){
      row.fresh=false;
      var t=document.querySelector('.tile[data-id="'+row.id+'"]');
      if(t)t.classList.remove("live");
    },4000);
  }
}
function onRemove(row){
  if(!row||!row.id)return;
  if(view==="home"){loadHome();return}
  var before=photos.length;
  photos=photos.filter(function(p){return p.id!==row.id});
  if(photos.length!==before){
    if(lbIdx>=0&&lbList[lbIdx]&&lbList[lbIdx].id===row.id)closeLb();
    renderCat();
  }
}

      });

  $("lb-send").onclick=sendCmt;

  $("lb-cover").onclick=function(){

    if(p.uploader!==me){toast("내가 올린 사진만 지울 수 있습니다");return}
    if(!confirm("이 사진을 지웁니다. 되돌릴 수 없습니다."))return;
    removePhotos([p.id]).then(function(){closeLb();renderCat()});
  };
  $("lb").onclick=function(e){if(e.target===$("lb"))closeLb()};

  /* 사진을 한 번 더 누르면 전체 화면 */

    $("zoom").classList.toggle("mag");
  };
  $("zoom").onclick=function(e){
    if(e.target===$("zoom"))closeZoom();
  };

  document.addEventListener("keydown",function(e){
    if(!$("zoom").hidden){
      if(e.key==="Escape")closeZoom();
      else if(e.key==="ArrowLeft"){stepLb(-1);openZoom()}
      else if(e.key==="ArrowRight"){stepLb(1);openZoom()}
      return;
    }
    if($("lb").hidden)return;
    if(e.key==="Escape")closeLb();
    else if(e.key==="ArrowLeft")stepLb(-1);
    else if(e.key==="ArrowRight")stepLb(1);
  });

  var depth=0;

    if(RO||view!=="cat")return;
    e.preventDefault();depth++;

    $("drop-where").textContent="["+catOf(cat).name+(f?" · "+f.name:"")+"]";
    $("drop").hidden=false;
  });

  window.addEventListener("drop",function(e){
    e.preventDefault();depth=0;$("drop").hidden=true;
    if(view!=="cat")return;
    if(e.dataTransfer&&e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);
  });
  window.addEventListener("paste",function(e){
    if(RO||view!=="cat"||!e.clipboardData)return;
    var fs=[];
    Array.prototype.forEach.call(e.clipboardData.items,function(it){
      if(it.kind==="file"){var f=it.getAsFile();if(f)fs.push(f)}
    });
    if(fs.length)handleFiles(fs);
  });

  var t=null;
  window.addEventListener("resize",function(){
    if(view!=="cat")return;
    clearTimeout(t);t=setTimeout(renderGrid,140);
  });
  window.addEventListener("hashchange",function(){
    if(!$("zoom").hidden)closeZoom(true);
    if(!$("lb").hidden)closeLb(true);
    route();
  });

  /* 휴대폰 뒤로 가기 — 앱을 나가지 않고 맨 위에 열린 것 한 겹만 닫습니다.
     전체 화면 → 크게 보기 → 목록 순으로 되돌아갑니다. */
  window.addEventListener("popstate",function(){
    if(!$("zoom").hidden){closeZoom(true);return}
    if(!$("lb").hidden)closeLb(true);
  });

  /* 탭을 오래 백그라운드에 두면 실시간 연결이 끊겨 화면이 낡을 수 있습니다.
     다시 돌아왔을 때 한 번 새로 읽어 맞춥니다. */
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)return;
    if(!$("lb").hidden)return;          /* 사진을 크게 보는 중에는 건드리지 않음 */
    if(view==="cat"&&cat)loadCat().then(renderCat);
    else if(view==="home")loadHome();
  });
}
/* 사진을 다른 카테고리로 옮깁니다.
   폴더는 카테고리에 속하므로, 옮길 때 폴더 지정은 함께 비웁니다. */
function catMenu(anchor,ids){
  closeMenu();
  var m=el("div","menu");m.id="fmenu";
  CATS.forEach(function(c){
    if(c.slug===cat)return;
    var b=el("button");
    b.textContent=c.name;
    b.onclick=function(){closeMenu();moveToCat(ids,c.slug)};
    m.appendChild(b);
  });
  var r=anchor.getBoundingClientRect();
  openMenu(m,r.left,r.top-220);
}
function moveToCat(ids,slug){
  if(!ids.length)return;
  sb.from("photos").update({cat:slug,folder:null}).in("id",ids).then(function(r){
    if(r.error){toast("옮기지 못했습니다");return}
    photos=photos.filter(function(p){return ids.indexOf(p.id)<0});
    if(!$("lb").hidden)closeLb();
    clearSel();
    renderCat();
    toast(ids.length+"장을 "+catOf(slug).name+" 으로 옮겼습니다");
  });
}
function moveTo(fid){
  if(!sel.length)return;
  sb.from("photos").update({folder:fid}).in("id",sel).then(function(r){
    if(r.error){toast("옮기지 못했습니다");return}
    photos.forEach(function(p){if(sel.indexOf(p.id)>=0)p.folder=fid});
    clearSel();renderCat();
  });
}

/* ================= 시작 ================= */
function start(){
  $("gate").hidden=true;
  renderHeader();
  connect();
  route();
  if(view==="home")loadHome();
}
function saveName(){
  var v=$("gate-in").value.trim().slice(0,12);
  if(!v){$("gate-in").focus();return}
  me=v;
  try{localStorage.setItem("ref-me",v)}catch(e){}
  start();
}

if(!window.supabase||!window.supabase.createClient){
  document.body.innerHTML='<div style="padding:60px 24px;font-size:14px;line-height:2">연결에 필요한 파일을 불러오지 못했습니다.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>';
}else{
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  try{me=localStorage.getItem("ref-me")||""}catch(e){me=""}
  wire();
  if(RO){
    document.body.classList.add("ro");
    me="";
    start();                    /* 닉네임을 묻지 않고 바로 사진을 보여줍니다 */
  }
  else if(TEST){
    me=TEST_NAME;               /* localStorage 에 쓰지 않습니다 */
    start();
  }
  else if(me){start()}
  else{
    $("gate-go").onclick=saveName;
    $("gate-in").onkeydown=function(e){if(e.key==="Enter"&&!e.isComposing)saveName()};
    $("gate-in").focus();
  }
}
})();
</script>
</body>
</html>
